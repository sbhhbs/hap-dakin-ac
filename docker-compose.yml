services:
  hap-daikin-ac:
    image: ${HAP_DAIKIN_IMAGE:-sbhhbs/hap-dakin-ac:latest}
    container_name: ${HAP_DAIKIN_CONTAINER_NAME:-hap-daikin-ac}
    restart: unless-stopped
    network_mode: host
    environment:
      HAP_DAIKIN_RM4_HOST: ${HAP_DAIKIN_RM4_HOST:-}
      HAP_DAIKIN_RM4_MAC: ${HAP_DAIKIN_RM4_MAC:-}
      HAP_DAIKIN_RM4_MAC_ADDRESS: ${HAP_DAIKIN_RM4_MAC_ADDRESS:-a0:43:b0:b9:f7:f6}
      HAP_DAIKIN_RM4_TIMEOUT: ${HAP_DAIKIN_RM4_TIMEOUT:-5}
      HAP_DAIKIN_RM4_LOCAL_IP: ${HAP_DAIKIN_RM4_LOCAL_IP:-}
      HAP_DAIKIN_RM4_DISCOVER_IP: ${HAP_DAIKIN_RM4_DISCOVER_IP:-}
      HAP_DAIKIN_RM4_REPEATS: ${HAP_DAIKIN_RM4_REPEATS:-1}
      HAP_DAIKIN_RM4_REPEAT_DELAY: ${HAP_DAIKIN_RM4_REPEAT_DELAY:-0.4}
      HAP_DAIKIN_HOMEKIT_ADDRESS: ${HAP_DAIKIN_HOMEKIT_ADDRESS:-}
      HAP_DAIKIN_HOMEKIT_PORT: ${HAP_DAIKIN_HOMEKIT_PORT:-51234}
      HAP_DAIKIN_HOMEKIT_PINCODE: ${HAP_DAIKIN_HOMEKIT_PINCODE:-031-45-154}
      HAP_DAIKIN_HOMEKIT_PERSIST_FILE: ${HAP_DAIKIN_HOMEKIT_PERSIST_FILE:-/data/.hap-daikin-ac.state}
      HAP_DAIKIN_HOMEKIT_NAME: ${HAP_DAIKIN_HOMEKIT_NAME:-Daikin AC}
      HAP_DAIKIN_INITIAL_TEMP: ${HAP_DAIKIN_INITIAL_TEMP:-24}
      HAP_DAIKIN_MIN_TEMP: ${HAP_DAIKIN_MIN_TEMP:-10}
      HAP_DAIKIN_MAX_TEMP: ${HAP_DAIKIN_MAX_TEMP:-30}
      HAP_DAIKIN_INITIAL_FAN: ${HAP_DAIKIN_INITIAL_FAN:-auto}
      HAP_DAIKIN_SENSOR_INTERVAL: ${HAP_DAIKIN_SENSOR_INTERVAL:-60}
      HAP_DAIKIN_LOGSTASH_URL: ${HAP_DAIKIN_LOGSTASH_URL:-}
      HAP_DAIKIN_LOGSTASH_TIMEOUT: ${HAP_DAIKIN_LOGSTASH_TIMEOUT:-3}
      HAP_DAIKIN_DRY_RUN: ${HAP_DAIKIN_DRY_RUN:-0}
      HAP_DAIKIN_LOG_LEVEL: ${HAP_DAIKIN_LOG_LEVEL:-INFO}
      HAP_DAIKIN_NO_COLOR: ${HAP_DAIKIN_NO_COLOR:-0}
    volumes:
      - hap-daikin-ac-state:/data

volumes:
  hap-daikin-ac-state:
